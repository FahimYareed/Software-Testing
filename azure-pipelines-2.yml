trigger:
- main

pool:
  vmImage: 'windows-latest'

stages:

- stage: Build
  displayName: 'Build'

  jobs:
  - job: BuildJob

    steps:

    - script:
        python -m pip install --target="$(Build.ArtifactStagingDirectory)\packages" -r requirements.txt
      workingDirectory: 'Testing'
      displayName: 'Install dependencies'

    - task: CopyFiles@2
      inputs:
        SourceFolder: 'Testing'
        Contents: |
          **
          !packages/**
        TargetFolder: '$(Build.ArtifactStagingDirectory)\project'
      displayName: 'Prepare project files'

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'build'
      displayName: 'Publish Build Artifact'


- stage: Test
  displayName: 'Test'
  dependsOn: Build

  jobs:
  - job: TestJob

    steps:

    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: 'build'
        path: '$(Pipeline.Workspace)\build'
      displayName: 'Download Build Artifact'

    - script: |
        set PYTHONPATH=$(Pipeline.Workspace)\build\packages
        python -m pytest --junitxml=test-results.xml
      workingDirectory: '$(Pipeline.Workspace)\build\project'
      displayName: 'Run pytest'

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Pipeline.Workspace)\build\project\test-results.xml'
        artifact: 'test-results'
      condition: succeededOrFailed()
      displayName: 'Publish Test Results Artifact'


- stage: PublishResults
  displayName: 'Publish Results'
  dependsOn: Test

  jobs:
  - job: PublishResultsJob

    steps:

    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: 'test-results'
        path: '$(Pipeline.Workspace)\results'
      displayName: 'Download Test Results'

    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(Pipeline.Workspace)\results\test-results.xml'
        testRunTitle: 'Pytest Results'
      condition: succeededOrFailed()
      displayName: 'Publish Test Results'